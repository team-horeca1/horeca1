name: CI / Deploy

# One pipeline: gates (type-check + lint, migrations + drift) run in parallel ->
# build image on GitHub (cached) -> push to GHCR -> SSH to the droplet and pull
# the SHA-pinned image + migrate + restart. Builds off the droplet so deploys are
# ~40s, never starve the droplet CPU, and can't run stale code.
#
# Notes (2026-08-06):
# - `master` is pushed to two remotes (team-horeca1 = canonical/public,
#   AneeVerse = private mirror). Only the canonical repo may build and deploy,
#   otherwise two runs race to SSH the same droplet and the mirror burns paid
#   Actions minutes.
# - Gates run as two parallel jobs so the gate is ~6 min instead of ~11 serial.
# - Only `deploy` takes the prod lock; builds may overlap safely.
# - ubuntu-24.04 is pinned instead of ubuntu-latest so image alias moves cannot
#   change the pool we queue against.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
  # Lets us re-deploy the current master without pushing a dummy commit.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/team-horeca1/horeca1
  NPM_FLAGS: --prefer-offline --no-audit --fund=false

jobs:
  checks:
    name: Type check & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci ${{ env.NPM_FLAGS }}
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Audit API permissions (strict)
        run: node scripts/audit-api-permissions.mjs --strict
      - name: Verify RBAC matrix (static)
        run: node scripts/verify-rbac-matrix.mjs

  db:
    name: Migrations & drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: db-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: horeca1
          POSTGRES_PASSWORD: horeca1_dev
          POSTGRES_DB: horeca1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horeca1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://horeca1:horeca1_dev@localhost:5432/horeca1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci ${{ env.NPM_FLAGS }}
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Migrations apply cleanly to a fresh database
        run: npx prisma migrate deploy
      - name: schema.prisma has not drifted from the migrations
        run: |
          npx prisma migrate diff \
            --from-config-datasource prisma.config.ts \
            --to-schema prisma/schema.prisma \
            --script > drift.sql 2>/dev/null || true
          # The only DDL Prisma does not model is the trigram GIN search indexes,
          # which the baseline creates as raw SQL. Allow exactly those; fail on anything else.
          REAL=$(grep -vE '^[[:space:]]*(--.*)?$' drift.sql | grep -viE 'products_(name|brand)_trgm' || true)
          if [ -n "$REAL" ]; then
            echo "::error::Schema drift detected — schema.prisma differs from the migrations."
            echo "Fix it by generating a migration:  npx prisma migrate dev --name <describe-change>"
            echo "----- unexpected diff -----"
            echo "$REAL"
            exit 1
          fi
          echo "✓ No drift — migrations reproduce schema.prisma exactly."

  build:
    name: Build & push image
    # Deliberately NOT gated on checks/db — the image build runs alongside them so
    # the pipeline is ~7 min instead of ~12. Nothing unvetted reaches production:
    # `deploy` still requires both gates, and a type error fails `next build` here
    # anyway, so a pushed image is always type-safe.
    if: >
      github.repository == 'team-horeca1/horeca1' &&
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE }}-worker:latest
            ${{ env.IMAGE }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: [checks, db, build]
    if: github.repository == 'team-horeca1/horeca1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only the prod deploy is serialised — two deploys must never overlap.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: SSH deploy (pull SHA-pinned image)
        uses: appleboy/ssh-action@v1
        with:
          host: 64.227.187.210
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          # No `fingerprint:` — the droplet's host key rotated and a pinned value
          # breaks every deploy. We control this static-IP box, so host-key pinning
          # adds little here; re-add a current fingerprint later if desired.
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_IMAGE,DEPLOY_SHA
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export DEPLOY_IMAGE DEPLOY_SHA
            cd /opt/horeca1
            git fetch origin master
            git reset --hard origin/master
            bash deploy.sh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}
          DEPLOY_SHA: ${{ github.sha }}
