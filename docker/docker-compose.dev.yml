# Local Next.js Turbopack in Linux (default via `npm run dev`).
# Lower host RAM than Windows Webpack — only Docker + optional SSH tunnel on the host.
# watchOptions.pollIntervalMs in next.config.ts helps Windows bind-mount HMR.
#
# Local Postgres + Redis (recommended):
#   npm run dev:db
#   npm run dev          → http://localhost:3000
#
# For reliable HMR on Windows (Turbopack on host, DB/Redis in Docker):
#   npm run dev:db
#   npm run dev:turbo    → http://localhost:3000
#
# Host Webpack fallback (if Turbopack misbehaves):
#   npm run dev:webpack  → http://localhost:3000
#
# If the UI looks stuck on an old build after edits:
#   npm run dev:fresh
#
# Prod DB via SSH tunnel (heavier; use only when you need prod data):
#   npm run tunnel       (separate terminal)
#   npm run dev:tunnel

services:
  app-dev:
    image: node:22-bookworm
    container_name: horeca1-app-dev
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - ../.env
      - ../.env.local
    environment:
      # Reach host-published postgres/redis from the container
      DATABASE_URL: postgresql://horeca1:horeca1_dev@host.docker.internal:5432/horeca1
      REDIS_URL: redis://host.docker.internal:6379
      AUTH_URL: http://localhost:3000
      HOSTNAME: "0.0.0.0"
      NODE_ENV: development
      # Windows bind-mount helpers (Webpack path); Turbopack uses next.config watchOptions
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      # Keep heap headroom; disable Next memory-watcher restarts
      NODE_OPTIONS: "--max-old-space-size=4096"
      __NEXT_DISABLE_MEMORY_WATCHER: "1"
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
    volumes:
      - ..:/app
      # Linux node_modules (host Windows modules are incompatible)
      - horeca1_dev_node_modules:/app/node_modules
      # Do NOT mount a persistent volume on /app/.next — it served stale Turbopack
      # chunks after source edits on Windows. .next lives on the bind mount (gitignored).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        if [ ! -x node_modules/.bin/next ]; then
          echo "[app-dev] Installing deps (first run)…"
          npm ci
          npx prisma generate
        fi
        echo "[app-dev] Starting Next.js (Turbopack) on :3000…"
        exec npx next dev --hostname 0.0.0.0 --port 3000

volumes:
  horeca1_dev_node_modules:
