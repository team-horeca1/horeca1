# ── HTTP (port 80) ─────────────────────────────────────────────────────────
# Two roles:
#   1. ACME challenge for Let's Encrypt cert renewals (must stay on port 80).
#   2. Permanent redirect of all other traffic to HTTPS so visitors never
#      land on plaintext.
#
# Production hosts (same app upstream):
#   freshville.store / www.freshville.store  — legacy (kept live, no redirect to horeca1 yet)
#   horeca1.com / www.horeca1.com            — new canonical
# Demo stays isolated: demo.horeca1.com → demo app only.

# Production — freshville.store (+ bare IP catch-all → production)
server {
    listen 80;
    server_name freshville.store www.freshville.store 64.227.187.210 _;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://freshville.store$request_uri;
    }
}

# Production — horeca1.com (canonical) + www
server {
    listen 80;
    server_name horeca1.com www.horeca1.com;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://horeca1.com$request_uri;
    }
}

# Demo — demo.horeca1.com (isolated staging; must NOT redirect to production)
server {
    listen 80;
    server_name demo.horeca1.com;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://demo.horeca1.com$request_uri;
    }
}

# ── HTTPS (port 443) — PRODUCTION (legacy freshville) ──────────────────────
# Kept serving the same production app during the validation period.
# Do NOT redirect freshville.store → horeca1.com until explicitly approved.
server {
    listen 443 ssl;
    http2 on;
    server_name freshville.store www.freshville.store;

    ssl_certificate     /etc/letsencrypt/live/freshville.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freshville.store/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:3000;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    client_max_body_size       25m;

    location / {
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── HTTPS (port 443) — PRODUCTION (canonical horeca1.com) ──────────────────
# Cert issued via: docker compose … run certbot certonly --webroot …
# If applied before the cert exists, use docker/nginx.horeca1-http-bootstrap.conf
# (or a temporary self-signed cert under live/horeca1.com) first.
server {
    listen 443 ssl;
    http2 on;
    server_name horeca1.com;

    ssl_certificate     /etc/letsencrypt/live/horeca1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horeca1.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:3000;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    client_max_body_size       25m;

    location / {
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# www → apex canonical
server {
    listen 443 ssl;
    http2 on;
    server_name www.horeca1.com;

    ssl_certificate     /etc/letsencrypt/live/horeca1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horeca1.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://horeca1.com$request_uri;
}

