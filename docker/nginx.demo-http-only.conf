# Bootstrap nginx: production HTTPS unchanged + demo HTTP only (for ACME).
# Used until Let's Encrypt cert for demo.horeca1.com exists.
# Then switch to docker/nginx.conf (full HTTPS for demo).

server {
    listen 80;
    server_name freshville.store www.freshville.store 64.227.187.210 _;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://freshville.store$request_uri;
    }
}

server {
    listen 80;
    server_name demo.horeca1.com;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    # Until TLS cert exists, proxy HTTP directly to demo app.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_demo horeca1-demo-app:3000;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    client_max_body_size       25m;

    location / {
        proxy_pass http://$upstream_demo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name freshville.store www.freshville.store;

    ssl_certificate     /etc/letsencrypt/live/freshville.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freshville.store/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:3000;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    client_max_body_size       25m;

    location / {
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
