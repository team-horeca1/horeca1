# Bootstrap nginx: production HTTPS (freshville + demo) unchanged +
# horeca1.com / www HTTP-only for ACME until Let's Encrypt cert exists.
# Then switch back to docker/nginx.conf (full HTTPS for horeca1.com).
#
# Usage on droplet:
#   cp docker/nginx.horeca1-http-bootstrap.conf docker/nginx.conf
#   docker compose -f docker/docker-compose.prod.yml exec nginx nginx -s reload
#   # after DNS A/@ + www point here:
#   docker compose -f docker/docker-compose.prod.yml run --rm certbot certonly \
#     --webroot -w /var/lib/letsencrypt \
#     -d horeca1.com -d www.horeca1.com --agree-tos --non-interactive -m TEAM_EMAIL
#   git checkout -- docker/nginx.conf   # or restore full nginx.conf
#   docker compose -f docker/docker-compose.prod.yml exec nginx nginx -s reload

server {
    listen 80;
    server_name freshville.store www.freshville.store 64.227.187.210 _;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://freshville.store$request_uri;
    }
}

server {
    listen 80;
    server_name horeca1.com www.horeca1.com;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    # Until TLS cert exists, proxy HTTP directly to production app so
    # Host-header / curl --resolve checks work before public DNS cutover.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:3000;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    client_max_body_size       25m;

    location / {
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name demo.horeca1.com;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://demo.horeca1.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name freshville.store www.freshville.store;

    ssl_certificate     /etc/letsencrypt/live/freshville.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freshville.store/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:3000;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    client_max_body_size       25m;

    location / {
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name demo.horeca1.com;

    ssl_certificate     /etc/letsencrypt/live/demo.horeca1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.horeca1.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_demo horeca1-demo-app:3000;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    client_max_body_size       25m;

    location / {
        proxy_pass http://$upstream_demo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
